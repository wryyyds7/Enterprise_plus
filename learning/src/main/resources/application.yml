spring:
  datasource:
    url: jdbc:mysql://localhost:3306/learning?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  application:
    name: learning
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.learning.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8095

logging:
  level:
    com.example.learning: debug
    org.springframework.web: info
    org.springframework.security: info